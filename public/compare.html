<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compare Vehicles | MK Finance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#159ac4; --blue-dark:#1f56c5; --red:#ef3030;
  --text:#ffffff; --muted:#8fa3ad; --line:rgba(42,138,173,.20);
  --shadow:0 18px 45px rgba(0,0,0,.28);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
html,body{overflow-x:hidden;max-width:100%}
body{font-family:Inter,Roboto,Arial,sans-serif;background:#06131a;color:var(--text);line-height:1.5}
a{text-decoration:none;color:inherit}
button,input,select{font:inherit}
.container{max-width:1400px;width:100%;margin:auto;padding:0 18px;box-sizing:border-box}
.topbar{height:68px;border-bottom:1px solid var(--line);background:#07151c;display:flex;align-items:center;position:sticky;top:0;z-index:1000}
.topbar-inner{display:flex;align-items:center;gap:22px;width:100%}
.logo{font-size:24px;font-weight:800;letter-spacing:-1px;white-space:nowrap}
.logo span:first-child{color:var(--red)} .logo span:last-child{color:var(--blue)}
.back-link{margin-left:auto;font-size:13px;color:rgba(255,255,255,0.6);cursor:pointer}
.back-link:hover{color:var(--blue)}

.hero{padding:28px 0 16px}
.hero h1{font-size:26px;margin-bottom:6px}
.hero p{color:var(--muted);font-size:13px}

.picker-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;padding:16px 0 24px}
.picker-slot{background:#0b1b23;border:1px dashed var(--line);border-radius:10px;padding:16px;text-align:center;cursor:pointer;min-height:140px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:border-color .2s}
.picker-slot:hover{border-color:var(--blue)}
.picker-slot .plus{font-size:26px;color:var(--blue)}
.picker-slot .lbl{font-size:11px;color:var(--muted)}
.filled-slot{background:#0b1b23;border:1px solid var(--line);border-radius:10px;padding:14px;position:relative;text-align:center}
.filled-slot .remove{position:absolute;top:8px;right:8px;background:rgba(239,48,48,.15);color:var(--red);border:none;border-radius:50%;width:22px;height:22px;cursor:pointer;font-size:13px;line-height:1}
.filled-slot .img{height:70px;display:flex;align-items:center;justify-content:center;font-size:2.1rem;margin-bottom:6px;overflow:hidden;border-radius:6px;background:rgba(21,154,196,.06)}
.filled-slot .img img{width:100%;height:100%;object-fit:cover}
.filled-slot h4{font-size:13px;margin-bottom:2px}
.filled-slot .price{font-size:12px;color:var(--blue);font-weight:700}

.picker-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:2000;align-items:flex-start;justify-content:center;padding:60px 20px}
.picker-modal.open{display:flex}
.picker-box{background:#0b1b23;border:1px solid var(--line);border-radius:12px;max-width:600px;width:100%;max-height:75vh;overflow:auto;padding:20px}
.picker-box h3{margin-bottom:14px}
.picker-search{width:100%;padding:12px 14px;background:#081820;border:1px solid var(--line);border-radius:8px;color:#fff;margin-bottom:14px}
.picker-item{display:flex;align-items:center;gap:12px;padding:10px;border-radius:8px;cursor:pointer}
.picker-item:hover{background:#0d2029}
.picker-item .ic{font-size:1.6rem;width:40px;text-align:center}
.picker-item .nm{font-size:13px;font-weight:600}
.picker-item .pr{font-size:12px;color:var(--muted)}
.picker-close{float:right;cursor:pointer;color:var(--muted);font-size:20px}

/* Sticky controls bar: category nav + search + toggles */
.controls-bar{position:sticky;top:68px;z-index:900;background:#07151c;border-bottom:1px solid var(--line);padding:0;margin-bottom:20px}
.cat-nav{display:flex;gap:22px;overflow-x:auto;padding:0 18px;max-width:1400px;margin:auto;scrollbar-width:none}
.cat-nav::-webkit-scrollbar{display:none}
.cat-nav-item{padding:14px 2px;font-size:13px;font-weight:600;color:rgba(255,255,255,.6);white-space:nowrap;cursor:pointer;border-bottom:2px solid transparent}
.cat-nav-item:hover{color:#fff}
.cat-nav-item.active{color:var(--red);border-bottom-color:var(--red)}
.controls-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 18px;max-width:1400px;margin:auto;border-top:1px solid var(--line)}
.search-box{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;background:#0b1b23;border:1px solid var(--line);border-radius:20px;padding:8px 16px;}
.search-box input{flex:1;background:transparent;border:0;outline:0;color:#fff;font-size:13px}
.toggle-wrap{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);cursor:pointer;user-select:none}
.toggle-switch{width:36px;height:20px;background:#0d2029;border:1px solid var(--line);border-radius:20px;position:relative;transition:background .2s}
.toggle-switch.on{background:var(--blue)}
.toggle-switch .knob{position:absolute;top:2px;left:2px;width:14px;height:14px;background:#fff;border-radius:50%;transition:left .2s}
.toggle-switch.on .knob{left:18px}

.cat-section{background:#0b1b23;border:1px solid var(--line);border-radius:10px;margin-bottom:16px;overflow:hidden;box-shadow:var(--shadow);scroll-margin-top:160px}
.cat-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;cursor:pointer;user-select:none}
.cat-header h3{font-size:15px;font-weight:700;display:flex;align-items:center;gap:10px}
.cat-header .chev{color:var(--muted);transition:transform .2s;font-size:14px}
.cat-section.collapsed .chev{transform:rotate(-90deg)}
.cat-body{overflow-x:auto}
.cat-section.collapsed .cat-body{display:none}

.compare-table{width:100%;border-collapse:collapse;min-width:600px}
.compare-table th,.compare-table td{padding:12px 20px;border-top:1px solid var(--line);font-size:13px;text-align:left;white-space:nowrap}
.compare-table th{background:#0d2029;font-weight:700;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.row-label-col{position:sticky;left:0;background:#0b1b23;z-index:3;font-weight:600;color:#dbe7ec;min-width:190px}
.compare-table th.row-label-col{z-index:4;background:#0d2029}
.diff-highlight td{color:#fff;font-weight:700}
.diff-highlight .row-label-col{border-left:3px solid var(--blue)}
.val-yes{color:#2ecf7a;font-weight:700}
.val-no{color:var(--red);font-weight:700}
.empty-msg{text-align:center;padding:60px 20px;color:var(--muted)}
.no-results{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px}
@media(max-width:700px){
  .row-label-col{min-width:130px;font-size:12px}
  .compare-table th,.compare-table td{padding:10px 14px}
  .controls-row{flex-direction:column;align-items:stretch}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="container topbar-inner">
    <a class="logo" href="/index.html"><span>MK</span> <span>Finance</span></a>
    <span class="back-link" onclick="window.location.href='/index.html#vehicles'">← Back to Vehicles</span>
  </div>
</header>

<div class="container">
  <div class="hero">
    <h1>Compare <span style="color:var(--blue)">Vehicles</span></h1>
    <p>Add up to 6 vehicles and compare full specifications side by side — real data only.</p>
  </div>

  <div class="picker-row" id="pickerRow"></div>
</div>

<div class="controls-bar" id="controlsBar" style="display:none;">
  <div class="cat-nav" id="catNav"></div>
  <div class="controls-row">
    <div class="search-box">
      <span>🔍</span>
      <input id="searchInput" placeholder="Search a feature or spec e.g. Sunroof" oninput="onSearchInput()">
    </div>
    <div class="toggle-wrap" onclick="toggleHideCommon()">
      <div class="toggle-switch" id="hideCommonSwitch"><div class="knob"></div></div>
      <span>Hide Common Features</span>
    </div>
    <div class="toggle-wrap" onclick="toggleHighlight()">
      <div class="toggle-switch on" id="highlightSwitch"><div class="knob"></div></div>
      <span>Highlight Differences</span>
    </div>
  </div>
</div>

<div class="container">
  <div id="compareSections"></div>
</div>

<div class="picker-modal" id="pickerModal">
  <div class="picker-box">
    <span class="picker-close" onclick="closePicker()">✕</span>
    <h3>Select a vehicle</h3>
    <p id="pickerGroupNote" style="font-size:12px; color:var(--blue); margin-bottom:10px;"></p>
    <input class="picker-search" id="pickerSearch" placeholder="Search by brand or model..." oninput="renderPickerList()">
    <div id="pickerList"></div>
  </div>
</div>

<script>
const MAX_SLOTS = 6;
let allVehicles = [];
let selected = [];
let activeSlotIndex = null;
let hideCommon = false;
let highlightDiff = true;
let searchQuery = '';
let sectionsData = []; // [{ key, title, rows: [{label, values:[...]}] }]
let observer = null;

async function init() {
  try {
    const res = await fetch('/api/vehicles?_=' + Date.now(), { cache: 'no-store' });
    allVehicles = await res.json();
  } catch (e) { allVehicles = []; }

  const params = new URLSearchParams(window.location.search);
  const ids = (params.get('ids') || '').split(',').map(s => s.trim()).filter(Boolean);
  const variantLabels = (params.get('variants') || '').split(',').map(s => decodeURIComponent(s || ''));

  ids.forEach((id, i) => {
    const base = allVehicles.find(x => String(x.id) === id);
    if (!base || selected.length >= MAX_SLOTS) return;
    const label = variantLabels[i] || '';
    if (!label) { selected.push(base); return; }

    // Build a variant-specific display copy: override price/transmission/fuel from the
    // matching entry in base.variants ("Name:Price:Transmission:Fuel"), keep real specs.
    const variantEntry = (base.variants || '').split(',').map(x => x.trim()).find(x => x.split(':')[0].trim() === label);
    const copy = Object.assign({}, base);
    copy._variantLabel = label;
    if (variantEntry) {
      const parts = variantEntry.split(':');
      if (parts[1]) copy.price = parts[1].trim();
      const trans = parts[2] ? parts[2].trim() : '';
      const fuel = parts[3] ? parts[3].trim() : '';
      if (trans || fuel) copy.fuel_type = [fuel, trans].filter(Boolean).join(' | ');
    }
    selected.push(copy);
  });

  renderSlots();
  buildAndRenderCompare();
}

function displayName(v) {
  return v.brand + ' ' + v.model + (v._variantLabel ? ' (' + v._variantLabel + ')' : '');
}

function renderSlots() {
  const row = document.getElementById('pickerRow');
  let html = '';
  for (let i = 0; i < MAX_SLOTS; i++) {
    const v = selected[i];
    if (v) {
      html += `
        <div class="filled-slot">
          <button class="remove" onclick="removeSlot(${i})">✕</button>
          <div class="img">${v.image_url ? `<img src="${v.image_url}" onerror="this.parentElement.textContent='${v.icon || '🚗'}'">` : (v.icon || '🚗')}</div>
          <h4>${displayName(v)}</h4>
          <div class="price">${v.price || 'Price on request'}</div>
        </div>`;
    } else if (i === selected.length) {
      html += `
        <div class="picker-slot" onclick="openPicker(${i})">
          <div class="plus">+</div>
          <div class="lbl">Add Vehicle</div>
        </div>`;
    } else {
      html += `<div class="picker-slot" style="opacity:.3; cursor:default; pointer-events:none;"><div class="lbl">Empty</div></div>`;
    }
  }
  row.innerHTML = html;
}

function openPicker(slotIndex) {
  activeSlotIndex = slotIndex;
  document.getElementById('pickerModal').classList.add('open');
  document.getElementById('pickerSearch').value = '';
  renderPickerList();
}
function closePicker() { document.getElementById('pickerModal').classList.remove('open'); }
function categoryGroup(category) { return category === 'Car' ? 'Car' : 'Commercial'; }

function renderPickerList() {
  const q = document.getElementById('pickerSearch').value.trim().toLowerCase();
  const selectedIds = selected.map(v => v.id);
  const lockedGroup = selected.length ? categoryGroup(selected[0].category) : null;
  const list = allVehicles.filter(v =>
    !selectedIds.includes(v.id) &&
    (!lockedGroup || categoryGroup(v.category) === lockedGroup) &&
    (v.brand + ' ' + v.model).toLowerCase().includes(q)
  );
  const box = document.getElementById('pickerList');
  const noteEl = document.getElementById('pickerGroupNote');
  if (noteEl) noteEl.textContent = lockedGroup ? `Showing ${lockedGroup === 'Car' ? 'cars' : 'commercial vehicles'} only — matching your current comparison.` : '';
  if (!list.length) {
    box.innerHTML = '<p style="color:var(--muted); font-size:13px; padding:14px;">No matching vehicles found.</p>';
    return;
  }
  box.innerHTML = list.map(v => `
    <div class="picker-item" onclick="selectVehicle(${v.id})">
      <div class="ic">${v.icon || '🚗'}</div>
      <div>
        <div class="nm">${v.brand} ${v.model}</div>
        <div class="pr">${v.price || 'Price on request'}</div>
      </div>
    </div>`).join('');
}
function selectVehicle(id) {
  const v = allVehicles.find(x => x.id === id);
  if (!v) return;
  selected[activeSlotIndex] = v;
  selected = selected.filter(Boolean);
  closePicker();
  renderSlots();
  buildAndRenderCompare();
  updateUrl();
}
function removeSlot(i) {
  selected.splice(i, 1);
  renderSlots();
  buildAndRenderCompare();
  updateUrl();
}
function updateUrl() {
  const ids = selected.map(v => v.id).join(',');
  const url = ids ? ('/compare.html?ids=' + ids) : '/compare.html';
  window.history.replaceState(null, '', url);
}

function parseSpecs(v) {
  const raw = [
    ...(v.detailed_specs || '').split(',').map(x => x.trim()).filter(Boolean),
    ...(v.key_features || '').split(',').map(x => x.trim() + ':✓').filter(x => x !== ':✓')
  ];
  const map = {};
  raw.forEach(x => {
    if (!x.includes('::')) return;
    const [cat, rest] = x.split('::');
    const parts = rest.split(':');
    const label = (parts[0] || '').trim();
    const value = parts.slice(1).join(':').trim() || '✓';
    map[cat.trim() + '|' + label] = value;
  });
  return map;
}

function formatVal(v) {
  if (v === '✓') return '<span class="val-yes">✓</span>';
  if (v === '✕' || v === 'No' || v === 'no') return '<span class="val-no">✕</span>';
  return v;
}

function buildAndRenderCompare() {
  const wrap = document.getElementById('compareSections');
  const controlsBar = document.getElementById('controlsBar');
  if (selected.length < 2) {
    controlsBar.style.display = 'none';
    wrap.innerHTML = `<div class="empty-msg">Add at least 2 vehicles above to see a full specification comparison.</div>`;
    return;
  }
  controlsBar.style.display = 'block';

  const specMaps = selected.map(parseSpecs);
  const orderedKeys = [];
  const seen = new Set();
  specMaps.forEach(map => {
    Object.keys(map).forEach(k => { if (!seen.has(k)) { seen.add(k); orderedKeys.push(k); } });
  });
  const byCategory = {};
  orderedKeys.forEach(k => {
    const [cat, label] = k.split('|');
    byCategory[cat] = byCategory[cat] || [];
    byCategory[cat].push({ label, values: specMaps.map(m => m[k] || '—') });
  });

  sectionsData = [
    {
      key: 'overview', title: 'Basic Information',
      rows: [
        { label: 'Price', values: selected.map(v => v.price || '-') },
        { label: 'EMI', values: selected.map(v => v.emi || '-') },
        { label: 'Fuel Type', values: selected.map(v => v.fuel_type || '-') },
        { label: 'Category', values: selected.map(v => v.category || '-') }
      ]
    },
    ...Object.keys(byCategory).map(cat => ({ key: slugifyKey(cat), title: cat, rows: byCategory[cat] }))
  ];

  buildCategoryNav();
  renderSections();
  setupScrollSpy();
}

function slugifyKey(s) { return 'sec-' + s.toLowerCase().replace(/[^a-z0-9]+/g, '-'); }

function buildCategoryNav() {
  document.getElementById('catNav').innerHTML = sectionsData.map((s, i) => `
    <div class="cat-nav-item ${i === 0 ? 'active' : ''}" data-target="${s.key}" onclick="scrollToSection('${s.key}')">${s.title}</div>
  `).join('');
}

function scrollToSection(key) {
  const el = document.getElementById(key);
  if (el) {
    el.classList.remove('collapsed');
    el.scrollIntoView({ behavior: 'smooth' });
  }
}

function renderSections() {
  const wrap = document.getElementById('compareSections');
  const q = searchQuery.trim().toLowerCase();

  const html = sectionsData.map(sec => {
    let rows = sec.rows;
    if (hideCommon) {
      rows = rows.filter(r => !r.values.every(v => v === r.values[0]));
    }
    if (q) {
      rows = rows.filter(r => r.label.toLowerCase().includes(q) || sec.title.toLowerCase().includes(q));
    }
    if (!rows.length) return '';

    const rowsHtml = rows.map(r => {
      const allSame = r.values.every(v => v === r.values[0]);
      const rowClass = (highlightDiff && !allSame) ? 'diff-highlight' : '';
      return `<tr class="${rowClass}"><td class="row-label-col">${r.label}</td>${r.values.map(v => `<td>${formatVal(v)}</td>`).join('')}</tr>`;
    }).join('');

    const headHtml = `<tr><th class="row-label-col">Specification</th>${selected.map(v => `<th>${displayName(v)}</th>`).join('')}</tr>`;

    return `
      <div class="cat-section" id="${sec.key}">
        <div class="cat-header" onclick="toggleSection('${sec.key}')">
          <h3>${sec.title}</h3>
          <span class="chev">▾</span>
        </div>
        <div class="cat-body">
          <table class="compare-table">
            <thead>${headHtml}</thead>
            <tbody>${rowsHtml}</tbody>
          </table>
        </div>
      </div>`;
  }).join('');

  wrap.innerHTML = html || `<div class="no-results">No matching specifications found.</div>`;
}

function toggleSection(key) {
  const el = document.getElementById(key);
  if (el) el.classList.toggle('collapsed');
}

function onSearchInput() {
  searchQuery = document.getElementById('searchInput').value;
  renderSections();
}

function toggleHideCommon() {
  hideCommon = !hideCommon;
  document.getElementById('hideCommonSwitch').classList.toggle('on', hideCommon);
  renderSections();
}
function toggleHighlight() {
  highlightDiff = !highlightDiff;
  document.getElementById('highlightSwitch').classList.toggle('on', highlightDiff);
  renderSections();
}

function setupScrollSpy() {
  if (observer) observer.disconnect();
  const navItems = [...document.querySelectorAll('.cat-nav-item')];
  observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const key = entry.target.id;
        navItems.forEach(n => n.classList.toggle('active', n.dataset.target === key));
      }
    });
  }, { rootMargin: '-180px 0px -70% 0px', threshold: 0 });
  document.querySelectorAll('.cat-section').forEach(sec => observer.observe(sec));
}

init();
</script>
</body>
</html>
